  <title>Chứng Nhân — Di Sản Giao Ước</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./witness.css">
  <script src="./vendor/adventure-cast.js" defer></script>
  <script src="./vendor/character-profiles.js" defer></script>
  <script src="./vendor/adventure-visuals.js" defer></script>
  <script src="./assets/human-topology.js" defer></script>
  <script src="./vendor/character-detail.js" defer></script>
  <script src="./vendor/adventure-character.js" defer></script>
  <script src="./witness-content.js" defer></script>
  <script src="./witness-spine.js" defer></script>
  <script src="./witness-model.js" defer></script>

<body>
  <main id="game" aria-label="Chứng Nhân — Di Sản Giao Ước">
    <div id="world" class="world"><div class="adv-markers"></div></div>
    <div class="vignette" aria-hidden="true"></div>
    <section id="title-screen" class="title-screen">
      <div class="title-copy"><span class="eyebrow">THE WITNESS · LEGACY OF THE COVENANT</span><h1>Chứng Nhân</h1><p class="title-sub">Di Sản Giao Ước</p><p class="title-lead">Bước vào những câu chuyện Kinh Thánh.<br>Khám phá. Lắng nghe. Cùng bước tiếp.</p><div id="title-actions"><button class="primary" data-act="new">Bắt đầu hành trình <span aria-hidden="true">→</span></button></div><div class="title-secondary"><button data-act="import">Nhập bản lưu</button><button data-act="about">Về hành trình này</button></div><p class="edition">BA HỒI · MÔSÊ — ĐAVÍT — PHÊRÔ</p></div>
      <div class="title-caption"><span>XÊDARÊ</span><p>Mỗi cuộc đời đều để lại một lời chứng.</p></div>
    </section>
    <header id="hud-top" class="hud-top" hidden><button class="brand" data-act="pause" aria-label="Mở menu">W<span>CHỨNG NHÂN</span></button><div class="place"><span id="region-name"></span><strong id="chapter-name"></strong></div><div class="hud-tools"><button data-act="journal" title="Sổ hành trình (J)"><span class="icon">▤</span><span class="tool-label">Sổ</span></button><button data-act="map" title="Bản đồ (M)"><span class="icon">⌑</span><span class="tool-label">Bản đồ</span></button><button data-act="settings" title="Tùy chỉnh"><span class="icon">☷</span><span class="tool-label">Tùy chỉnh</span></button></div></header>
    <aside id="objective" class="objective" hidden><p class="spine-context" id="spine-status"></p><span class="eyebrow" id="quest-number"></span><h2 id="objective-title"></h2><p id="objective-detail"></p><div id="quest-progress" class="quest-progress"></div><button class="text-link" data-act="guide">Chỉ hướng tiếp theo <span aria-hidden="true">↗</span></button></aside>
    <div id="companion-hud" class="companion-hud" hidden></div>
    <aside id="combat-hud" class="combat-hud" hidden><strong>Sân luyện · không gây thương tích</strong><p id="combat-state"></p><span id="combat-tell"></span><div><button data-act="strike">Đánh <kbd>K</kbd></button><button data-act="guard" id="touch-guard">Giữ để đỡ <kbd>H</kbd></button><button data-act="dodge">Né <kbd>Space</kbd></button><button data-act="stop-trial">Dừng tập</button></div></aside>
    <div id="subtitle" class="ambient-line" role="status" aria-live="polite"></div>
    <footer id="hud-bottom" class="hud-bottom" hidden><div class="control-legend"><span><kbd>W A S D</kbd> Di chuyển</span><span><kbd>Kéo</kbd> Nhìn quanh</span><span><kbd>J</kbd> Sổ</span></div><div class="interaction"><span id="compass" class="compass" hidden aria-hidden="true"><i></i></span><small id="distance-label"></small><button id="interact-button" class="primary" data-act="interact"><kbd>E</kbd><span id="interact-label">Khám phá bến cảng</span></button></div><span id="save-status" class="save-status">Đã lưu</span></footer>
    <div id="touch-controls" class="touch-controls" hidden><div id="stick" class="stick"><i></i></div><div class="touch-camera"><button data-act="sense" aria-label="Nhận ra dấu vết gần đây">◎</button><button data-act="recenter" aria-label="Đặt lại góc nhìn">↻</button><button data-act="zoom-in" aria-label="Đến gần">+</button><button data-act="zoom-out" aria-label="Lùi xa">−</button></div></div>
    <div id="modal-host"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="transition" class="transition" aria-hidden="true"><span></span><h2></h2><p></p></div>
  </main>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <noscript>Hãy bật JavaScript để bắt đầu hành trình.</noscript>
</body>
</html>
