name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Contract, unit and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm ci --prefix tools/environment-kit
      - name: Governance
        run: npm run check:agents
      - name: Unit and model checks
        run: npm test
      - name: Governance behaviour
        run: npm run test:agents
      - name: Cloud and save contract
        run: npm run test:backend
      - name: Install documentation dependencies
        run: python -m pip install -r tools/requirements-docs.txt
      - name: Reader export
        run: python tools/build-witness-docs.py
      - name: Build
        run: npm run build
      - name: Generated output pipeline
        run: npm run test:build-output

  browser-gate:
    name: Browser gate without a GPU
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm ci --prefix tools/environment-kit
      - name: Install documentation dependencies
        run: python -m pip install -r tools/requirements-docs.txt
      - name: Reader export
        run: python tools/build-witness-docs.py
      - name: Build
        run: npm run build
      # A GitHub runner has no GPU, so the browser gates must run on the software rasteriser.
      # The wait budgets scale with it; nothing here may pass by skipping a check.
      - name: Start local test server
        run: |
          node tools/serve.cjs &
          node -e "const t=Date.now();(async()=>{while(Date.now()-t<60000){try{await fetch('http://127.0.0.1:8034/');process.exit(0)}catch{await new Promise(r=>setTimeout(r,500))}}process.exit(1)})()"
      - name: Graphics gate (software rendering)
        env:
          WITNESS_QA_HARDWARE: '0'
        run: npm run test:graphics
      - name: Greybox gate smoke (software rendering)
        env:
          WITNESS_QA_HARDWARE: '0'
          WITNESS_GREYBOX_SMOKE: '1'
          WITNESS_GREYBOX_URL: http://127.0.0.1:8034/q01-greybox.html
          WITNESS_GREYBOX_OFFLINE: dist/q01-greybox-offline.html
        run: npm run test:q01-greybox-browser

  windows-checkout:
    name: Windows checkout builds with the same line endings
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/environment-kit
      - name: Build
        run: npm run build
